name: Resume CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  pages: write

concurrency:
  group: resume_ryan-wallace-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_BASENAME: resume_ryan-wallace
  PAGES_BASE_URL: https://resume.ryancswallace.dev

jobs:
  build:
    name: Build and validate all resumes
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      updated_at: ${{ steps.metadata.outputs.updated_at }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute run metadata
        id: metadata
        shell: bash
        run: |
          UPDATED_AT="$(date -u +%Y-%m-%dT%H-%M-%S)"
          RELEASE_TAG="${ARTIFACT_BASENAME}-${UPDATED_AT}"
          {
            printf 'UPDATED_AT=%s\n' "${UPDATED_AT}"
            printf 'RELEASE_TAG=%s\n' "${RELEASE_TAG}"
            printf 'GIT_SHA=%s\n' "${GITHUB_SHA}"
          } >> "${GITHUB_ENV}"
          {
            printf 'updated_at=%s\n' "${UPDATED_AT}"
            printf 'release_tag=%s\n' "${RELEASE_TAG}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pre-check tools
        shell: bash
        run: npm install --global cspell markdownlint-cli2 prettier

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            biber \
            chktex \
            ghostscript \
            jq \
            latexmk \
            make \
            pandoc \
            poppler-utils \
            texlive-base \
            texlive-bibtex-extra \
            texlive-extra-utils \
            texlive-fonts-recommended \
            texlive-lang-english \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-luatex \
            texlive-pictures \
            texlive-plain-generic \
            texlive-science \
            texlive-xetex

      - name: Run resume CI checks
        shell: bash
        run: make ci

      - name: Upload combined resume review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.metadata.outputs.release_tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload software engineering review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: software-engineering-${{ steps.metadata.outputs.updated_at }}
          path: build/targeted-resumes/software-engineering/
          if-no-files-found: error
          retention-days: 30

      - name: Upload ML/AI engineering review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-ai-engineering-${{ steps.metadata.outputs.updated_at }}
          path: build/targeted-resumes/ml-ai-engineering/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy-pages:
    name: Publish latest to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Create archival release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.release_tag }}
          path: dist/

      - name: Create immutable dated GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          UPDATED_AT: ${{ needs.build.outputs.updated_at }}
        run: |
          cat > release-notes.md <<NOTES
          Resume archival release generated at ${UPDATED_AT} UTC.

          Latest public links:
          - PDF: ${PAGES_BASE_URL}/${ARTIFACT_BASENAME}.pdf
          - RTF: ${PAGES_BASE_URL}/${ARTIFACT_BASENAME}.rtf
          - Markdown: ${PAGES_BASE_URL}/${ARTIFACT_BASENAME}.md
          - TeX: ${PAGES_BASE_URL}/${ARTIFACT_BASENAME}.tex
          NOTES

          gh release create "${RELEASE_TAG}" \
            "dist/${ARTIFACT_BASENAME}.pdf" \
            "dist/${ARTIFACT_BASENAME}.rtf" \
            "dist/${ARTIFACT_BASENAME}.md" \
            "dist/${ARTIFACT_BASENAME}.tex" \
            dist/SHA256SUMS \
            dist/metadata.json \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md
